metadata:
  source_document: "10 Risk Matrix model (2).odt"
  migration: "api/migrations/0043_seed_risk_factor_matrix.py"
  scope: "Profile and lifestyle risk factors supported by the current data model"
  status_values:
    implemented: "Directly represented by an existing app field and seeded in migration 0043."
    mapped: "Represented by an existing app field after an explicit product mapping decision."
    deferred: "Present in the source matrix, but not implemented in migration 0043."

risk_priorities:
  Preeclampsia: 1
  Preterm birth: 2
  GDM: 3
  Low Birth Weight: 4
  Placental abruption: 5
  Anemia: 6
  PROM: 7
  Hyperemesis: 8
  Cardiovascular Complications: 9
  Fetal Hypoxia: 10

