deferred_items:
  - source_factor: Work Hours >40 hrs/week
    status: deferred
    reason: "No work_hours_per_week field exists yet."

  - source_factor: Temperature
    status: deferred
    reason: "Requires rolling exposure windows, local percentiles, and pregnancy-week-aware environmental inputs."

  - source_factor: Solar UV
    status: deferred
    reason: "Requires UV aggregation, cumulative or rolling windows, and pregnancy-week-aware environmental inputs."

  - source_factor: Gestational window constraints for profile/lifestyle factors
    status: deferred
    reason: "Current UserRiskFactor and LifestyleRiskFactor conditions do not store or evaluate gestational windows."
