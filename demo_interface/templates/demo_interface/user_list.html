{% extends "base.html" %}

{% block title %}User List{% endblock %}

{% block content %}
  <h2>User List</h2>
  <ul class="list-group">
    {% for user in users %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ user.email }}
        <a class="btn btn-sm btn-outline-primary" href="{% url 'edit_user' user.id %}">Edit</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
