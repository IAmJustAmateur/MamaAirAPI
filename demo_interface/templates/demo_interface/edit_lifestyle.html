{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h3>Lifestyle — {{ target_user.get_full_name|default:target_user.email }}</h3>

  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} mt-3">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="card">
      <div class="card-body">
        {{ form.as_p }}
      </div>
    </div>
    <div class="mt-3">
      <a class="btn btn-secondary" href="{% url 'user_list' %}">Back</a>
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</div>
{% endblock %}
