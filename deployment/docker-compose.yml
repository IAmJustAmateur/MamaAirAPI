services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: agent_api_web
    command: ./entrypoint.sh
    env_file:
      - .env.prod
    volumes:
      - static_volume:/app/static
    depends_on:
      - db
    expose:
      - "8000"
    restart: always

  db:
    image: postgres:15
    container_name: agent_api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod
    restart: always

  nginx:
    image: nginx:latest
    container_name: agent_api_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
