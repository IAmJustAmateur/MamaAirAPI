services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: agent_api_web
    command: ./entrypoint.sh
    volumes:
      - static_volume:/app/static
    depends_on:
      - db
    expose:
      - "8000"
    restart: always
    env_file:
      - ../.env
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      DJANGO_DEBUG: ${DEBUG}
      DJANGO_ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DJANGO_ENV: ${DJANGO_ENV} # Set to 'production' for production environment

  db:
    image: postgres:15
    container_name: agent_api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  caddy:
    image: caddy:2
    container_name: agent_api_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Подхватит домен и email из .env
      DOMAIN: ${PUBLIC_DOMAIN}            # напр. api.mamaair.example.com
      ACME_EMAIL: ${ACME_EMAIL}           # твой email для Let's Encrypt
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # тут сертификаты
      - caddy_config:/config
      - static_volume:/app/static:ro      # чтобы раздавать /static/
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  caddy_data:
  caddy_config:
