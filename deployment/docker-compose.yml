services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: agent_api_web
    command: ./entrypoint.sh
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - /home/ec2-user/secrets/firebase_service_account.json:/run/secrets/firebase_service_account.json:ro  # <<< NEW
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: always
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},127.0.0.1,localhost
      CELERY_BROKER_URL: redis://redis:6379/0
      AUTH_REDIS_CACHE_URL: redis://redis:6379/1
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-${DEBUG}}        # опционально, если хочешь; можно удалить, если лишнее
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${ALLOWED_HOSTS}}
      DJANGO_ENV: ${DJANGO_ENV} # Set to 'production' for production environment
      FIREBASE_CREDENTIALS: /run/secrets/firebase_service_account.json   # <<< NEW
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/meta/choices/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery_worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["celery", "-A", "agent_api", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "email"]
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      AUTH_REDIS_CACHE_URL: redis://redis:6379/1
      FIREBASE_CREDENTIALS: /run/secrets/firebase_service_account.json
    volumes:
      - /home/ec2-user/secrets/firebase_service_account.json:/run/secrets/firebase_service_account.json:ro
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "celery -A agent_api inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:15
    container_name: agent_api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  caddy:
    image: caddy:2
    container_name: agent_api_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Подхватит домен и email из .env
      DOMAIN: ${PUBLIC_DOMAIN}            # напр. api.mamaair.example.com
      ACME_EMAIL: ${ACME_EMAIL}           # твой email для Let's Encrypt
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # тут сертификаты
      - caddy_config:/config
      - media_volume:/app/media:ro
      - static_volume:/app/static:ro      # чтобы раздавать /static/
    depends_on:
      - web

volumes:
  redis_data:
  postgres_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
